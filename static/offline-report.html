<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#285c3d"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/static/styles.css"><title>GreenYield · Field report</title></head>
<body class="report-page"><main class="report-shell"><header class="report-header"><a class="brand report-brand" href="/"><span class="brand-mark">✳</span><span>greenyield</span></a><div class="report-header-actions"><button class="report-link-button" onclick="history.back()">← वापस</button><button class="report-link-button" id="offline-language">English</button><button class="report-primary-button" id="download-offline-pdf">PDF डाउनलोड करें</button><button class="report-link-button" id="share-offline-report">PDF साझा करें</button></div></header>
<section class="report-intro"><div><h1 id="offline-title">आपकी खेत रिपोर्ट</h1><p id="offline-subtitle"></p></div></section><section class="report-main-column">
<article class="report-card"><h2 id="offline-estimate-title">उपज का अनुमान</h2><div class="estimate-grid"><div class="estimate-stat estimate-primary"><span id="offline-yield-label">अनुमानित उपज</span><strong id="offline-yield">—</strong><b>kg/ha</b></div><div class="estimate-stat"><span id="offline-range-label">अनुमान की सीमा</span><strong id="offline-range">—</strong><b>kg/ha</b></div><div class="estimate-stat"><span id="offline-total-label">आपके खेत की कुल उपज</span><strong id="offline-total">—</strong><b>tonnes</b></div></div><p id="offline-summary" class="outlook-copy"></p></article>
<article class="report-card"><h2 id="offline-risk-title">खेत में ध्यान रखें</h2><div id="offline-risk" class="risk-grid"></div></article>
<article class="report-card" id="offline-warnings-card" hidden><h2 id="offline-warnings-title">Check these values</h2><div id="offline-warnings" class="recommendation-list"></div></article>
<article class="report-card" id="offline-summary-card" hidden><h2 id="offline-summary-title">Field summary</h2><p id="offline-ai-summary" class="outlook-copy"></p><div id="offline-findings" class="recommendation-list"></div></article>
<article class="report-card"><h2 id="offline-actions-title">क्या करें</h2><div id="offline-actions" class="recommendation-list"></div></article>
<article class="report-card"><h2 id="offline-whatif-title">मान बदलकर देखें</h2><p id="offline-whatif-help" class="whatif-intro"></p><div class="whatif-controls" id="offline-controls"></div><div class="chart-grid"><section class="chart-card"><h3>खाद</h3><div id="offline-fert-graph"></div></section><section class="chart-card"><h3>कीटनाशक</h3><div id="offline-pest-graph"></div></section><section class="chart-card"><h3>मिट्टी का pH</h3><div id="offline-ph-graph"></div></section></div><div class="whatif-result" id="offline-preview"></div></article>
<article class="report-card"><h2 id="offline-inputs-title">आपकी जानकारी</h2><div class="field-detail-grid" id="offline-inputs"></div></article>
</section></main><script src="/static/i18n.js"></script><script src="/static/model/inference.js"></script><script src="/static/offline-report.js"></script></body></html>
